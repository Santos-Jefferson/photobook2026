<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0aa1dd" />
    <meta name="description" content="Turn your photos into a narrated, swipeable photo book story." />
    <!-- Installable as an app ("Add to Home Screen") -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Photobook" />
    <title>Photobook · Stories from your photos</title>
  </head>
  <body>
    <!-- Visible fallback: React replaces this on mount. If you see this text
         frozen, the app's JS never ran. If you see a totally BLANK/BLACK page
         (not even this text), you're loading a stale or empty build. -->
    <div id="root">
      <div style="padding:40px;font-family:system-ui,sans-serif;color:#16202c;text-align:center">
        <h2 style="color:#0aa1dd">Loading Photobook…</h2>
        <p style="color:#64748b">build 2026-06-01 · if this message stays, the app script failed to load.</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}))
      }
    </script>
  </body>
</html>
