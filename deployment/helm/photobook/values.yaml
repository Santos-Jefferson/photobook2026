replicaCount: 1

image:
  repository: your-registry.example.com/photobook
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Port the Node server listens on (matches container PORT).
containerPort: 5050

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: photobook.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: photobook-tls
    #   hosts:
    #     - photobook.example.com

# Server-side secrets. Rendered into a Kubernetes Secret and mounted as env
# (never baked into the public client bundle). Provide at deploy time from a CI
# variable rather than committing it here, e.g.:
#   helm upgrade ... --set-string secrets.anthropicApiKey="$bamboo_ANTHROPIC_API_KEY"
# When set, translation/narration use natural Claude localization; when empty,
# they fall back to the key-less Google endpoint.
secrets:
  anthropicApiKey: ""

# Extra non-secret runtime env vars. Use these to override neural voices, pick a
# translation model, or set an outbound proxy if your cluster has no direct
# internet egress.
env: {}
  # TRANSLATE_MODEL: claude-haiku-4-5
  # EDGE_VOICE_PT: pt-BR-AntonioNeural
  # EDGE_VOICE_JA: ja-JP-KeitaNeural
  # HTTPS_PROXY: http://proxy.company.com:8080

# Pod security context. runAsNonRoot needs a NUMERIC uid to be verifiable; the
# image's "node" user is uid/gid 1000.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
